# CI for the Angola Investment Execution Database.
# Runs the fast consistency gate AND the full health gate (round-trip rebuild
# + snapshot + app-JSON sync + doc drift) on every push/PR, so drift is caught
# before it reaches the default branch.
# A weekly scheduled job re-checks source URL liveness so link rot is caught
# even when no one is actively committing.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly URL-liveness re-check (Mondays ~09:00 UTC).
    - cron: '7 9 * * 1'

jobs:
  fast-gate:
    name: Fast gate (tests + invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # verify_invariants.py needs the DB, which is a gitignored build artifact.
      - name: Build DB from CSV checkpoints
        run: python db/load.py
      - name: Fast consistency gate
        run: python db/health.py --fast

  full-gate:
    name: Full gate (rebuild + snapshot + docs)
    runs-on: ubuntu-latest
    # Run the full gate on every push, PR, and scheduled tick. It is --no-network,
    # so it is safe on PRs; running it there catches snapshot / app-JSON / doc
    # drift before merge instead of only on the default branch. (The old guard
    # skipped PRs on the rationale that the full gate "needs the DB built" — but
    # the fast gate builds the DB too, so that rationale never held.)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build DB from CSV checkpoints
        run: python db/load.py
      - name: Full health gate (no network)
        run: python db/health.py --no-network

  js-tests:
    name: JS unit tests (node:test)
    runs-on: ubuntu-latest
    # Pure-logic front-end tests (app-logic.js, landing-logic.js) run with
    # Node's built-in test runner — no npm install, no package.json deps. The
    # product stays stdlib-Python-only; this is dev-time-only verification of
    # the decision/math logic extracted from the inline SPA/landing JS.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run JS pure-logic tests
        run: node --test test/js/*.test.js

  url-liveness:
    name: Source URL liveness (scheduled)
    runs-on: ubuntu-latest
    # Only the weekly scheduled run does a live URL sweep; PRs skip the network.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build DB
        run: python db/load.py
      - name: Re-check source URL liveness
        run: python db/verify_sources.py --limit 50